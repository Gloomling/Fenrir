# pyproject.toml — Fenrir Security Scanner
# Managed by Poetry. See https://python-poetry.org/

[tool.poetry]
name = "fenrir-scanner"
version = "2.0.0"
description = "A CLI-based multi-module security scanner for penetration testing."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "fenrir"}]

[tool.poetry.scripts]
fenrir     = "fenrir.cli:main"
fenrir-gui = "fenrir.fenrir_gui:launch_gui"

# ---------------------------------------------------------------------------
# Core dependencies
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
# Wide Python range — packages with <4.0 limits use markers (see below)
python          = ">=3.10,<4.0"

# Networking / HTTP
requests        = "^2.31.0"
httpx           = "^0.27.0"
aiodns          = "^3.2.0"

# Web / recon
beautifulsoup4  = "^4.12.3"
python-whois    = "^0.8.0"
webtech         = "^1.2.1"

# Packet capture / network (requires root for raw sockets)
scapy           = "^2.5.0"

# Config / env
python-dotenv   = "^1.0.1"

# Terminal / GUI
colorama        = "^0.4.6"
Pillow          = "^10.4.0"

# SSH / credentials
paramiko        = "^3.4.0"

# IoT
bleak           = {version = "^0.21.1", python = "<3.13"}
paho-mqtt       = "^2.1.0"

# Database / serialisation
PyYAML          = "^6.0"

# Mobile analysis
# androguard requires Python <4.0 — the python marker prevents Poetry from
# failing resolution when checking hypothetical Python 4.x compatibility.
androguard      = {version = "^4.1.2", python = "<4.0"}
cryptography    = "^42.0.0"

# TOML parsing for pyproject version reading (stdlib tomllib in 3.11+)
tomli           = {version = "^2.0.1", python = "<3.11"}

# ---------------------------------------------------------------------------
# Optional SDR hardware dependencies
# Install manually if you have RTL-SDR or SoapySDR hardware:
#   pip install pyrtlsdr numpy      (RTL-SDR dongle)
#   pip install SoapySDR numpy      (HackRF, LimeSDR, etc.)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]
pytest  = "^8.2.0"
black   = "^24.4.2"
ruff    = "^0.4.2"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length    = 88
target-version = ["py310", "py311", "py312", "py313"]
include        = '\\.pyi?$'
exclude = '''
/(
    \.eggs | \.git | \.venv | _build | build | dist | data
)/
'''

[tool.ruff]
line-length    = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "N"]
ignore = []
exclude = [
    ".eggs", ".git", ".venv", "__pypackages__",
    "_build", "build", "dist", "venv", "data",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
